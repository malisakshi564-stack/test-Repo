<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Profile - GameZone</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #4f46e5;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .profile-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .profile-card {
            background: rgba(255,255,255,0.12);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        .profile-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .info {
            text-align: left;
            background: rgba(255,255,255,0.08);
            padding: 18px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .label {
            color: #c4b5fd;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🎮 GameZone
        </div>

        <a href="/home" class="back-btn">
            🏠 Back to Home
        </a>

    </div>


    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-icon">
                👤
            </div>

            <h1>My Profile</h1>

            <div class="info">

                <div class="label">
                    Username
                </div>

                <div class="value"
                     th:text="${user.username}">
                    Username
                </div>

            </div>


            <div class="info">

                <div class="label">
                    Email
                </div>

                <div class="value"
                     th:text="${user.email}">
                    Email
                </div>

            </div>

        </div>

    </div>

</body>

</html>
