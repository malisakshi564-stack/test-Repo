<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GameZone - Edit Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111827;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        🎮 GameZone Admin
    </div>

    <a href="/admin-games" class="back">
        ⬅ Back to Games
    </a>

</div>


<div class="container">

    <div class="box">

        <h1>✏️ Edit Game</h1>

        <form action="/admin-games/update" method="post">

            <input
                type="hidden"
                name="id"
                th:value="${game.id}">

            <label>Game Name</label>

            <input
                type="text"
                name="name"
                th:value="${game.name}"
                required>


            <label>Description</label>

            <textarea
                name="description"
                th:text="${game.description}"
                required></textarea>


            <button type="submit">
                💾 Update Game
            </button>

        </form>

    </div>

</div>

</body>
</html>
