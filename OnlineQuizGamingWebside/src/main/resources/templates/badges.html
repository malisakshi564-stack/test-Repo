<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Achievements - GameZone</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #4f46e5;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #c4b5fd;
            margin-bottom: 35px;
        }

        .badges {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .badge-card {
            background: rgba(255,255,255,0.12);
            padding: 30px 20px;
            border-radius: 18px;
            transition: 0.3s;
        }

        .badge-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.18);
        }

        .badge-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .badge-card h2 {
            margin: 10px 0;
        }

        .badge-card p {
            color: #ddd;
            line-height: 1.5;
        }

        .no-badge {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            color: #ddd;
        }

        @media (max-width: 700px) {

            .badges {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 20px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🎮 GameZone
        </div>

        <a href="/home" class="back-btn">
            🏠 Back to Home
        </a>

    </div>


    <div class="container">

        <h1>🏅 My Achievements</h1>

        <p class="subtitle">
            Your earned GameZone badges
        </p>


        <div class="badges"
             th:if="${!badges.isEmpty()}">

            <div class="badge-card"
                 th:each="badge : ${badges}">

                <div class="badge-icon">
                    🏆
                </div>

                <h2 th:text="${badge.badgeName}">
                    Badge Name
                </h2>

                <p th:text="${badge.description}">
                    Badge Description
                </p>

            </div>

        </div>


        <div class="no-badge"
             th:if="${badges.isEmpty()}">

            🏆 No badges earned yet.

            <br><br>

            Keep playing games to unlock achievements!

        </div>

    </div>

</body>

</html>
