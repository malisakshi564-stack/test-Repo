<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GameZone - Admin Login</title>

    <style>
		* {
		    box-sizing: border-box;
		    margin: 0;
		    padding: 0;
		}

		body {
		    min-height: 100vh;
		    font-family: Arial, sans-serif;
		    background: linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    color: white;
		    padding-left: 100px;
		}

		.login-box {
		    width: 90%;
		    max-width: 420px;

		    padding: 40px 35px;

		    text-align: center;

		    background: rgba(255,255,255,0.08);

		    border: 1px solid rgba(255,255,255,0.15);

		    border-radius: 22px;

		    backdrop-filter: blur(12px);

		    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
		}

		.login-icon {
		    font-size: 55px;
		    margin-bottom: 15px;
		}

		h1 {
		    font-size: 30px;
		    color: #c4b5fd;
		    margin-bottom: 8px;
		}

		.subtitle {
		    color: #cbd5e1;
		    margin-bottom: 30px;
		}

		input {
		    width: 100%;

		    padding: 14px 15px;

		    margin-bottom: 16px;

		    border-radius: 10px;

		    border: 1px solid rgba(255,255,255,0.2);

		    background: rgba(255,255,255,0.1);

		    color: white;

		    font-size: 16px;

		    outline: none;
		}

		input::placeholder {
		    color: #cbd5e1;
		}

		input:focus {
		    border-color: #8b5cf6;

		    box-shadow: 0 0 10px rgba(139,92,246,0.3);
		}

		button {
		    width: 100%;

		    padding: 14px;

		    border: none;

		    border-radius: 10px;

		    background: linear-gradient(135deg, #7c3aed, #4f46e5);

		    color: white;

		    font-size: 16px;

		    font-weight: bold;

		    cursor: pointer;

		    transition: 0.3s;
		}

		button:hover {
		    transform: translateY(-2px);

		    box-shadow: 0 8px 20px rgba(124,58,237,0.4);
		}

		.error {
		    margin-bottom: 15px;

		    color: #fca5a5;

		    background: rgba(220,38,38,0.15);

		    padding: 10px;

		    border-radius: 8px;
		}

		.home-link {
		    display: inline-block;

		    margin-top: 22px;

		    color: #c4b5fd;

		    text-decoration: none;
		}

		.home-link:hover {
		    color: white;
		}
		.home-link {
		    display: inline-block;
		    margin-top: 22px;
		    padding: 10px 20px;
		    background: #4f46e5;
		    color: white;
		    text-decoration: none;
		    border-radius: 8px;
		    font-weight: bold;
		}

		.home-link:hover {
		    background: #7c3aed;
		}
		.home-buttons {
		    margin-top: 25px;
		    display: flex;
		    justify-content: center;
		    gap: 12px;
		}

		.home-btn,
		.user-login-btn {
		    display: inline-block;
		    padding: 10px 18px;
		    border-radius: 8px;
		    text-decoration: none;
		    color: white;
		    font-weight: bold;
		}

		.home-btn {
		    background: #4f46e5;
		}

		.home-btn:hover {
		    background: #7c3aed;
		}

		.user-login-btn {
		    background: #374151;
		}

		.user-login-btn:hover {
		    background: #4b5563;
		}
		
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎮 GameZone</div>

    <h2>🔐 Admin Login</h2>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>
<br>
    <form action="/admin-login" method="post">

        <label>Admin Username</label>

        <input type="text"
               name="username"
               placeholder="Enter admin username"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter admin password"
               required>

        <button type="submit" class="login-btn">
            Admin Login
        </button>

    </form>
	<div class="home-buttons">

	    <a href="/" class="home-btn">
	        🏠 Home
	    </a>

	    <a href="/login" class="user-login-btn">
	        ⬅ User Login
	    </a>

	</div>

</div>

</body>

</html>
