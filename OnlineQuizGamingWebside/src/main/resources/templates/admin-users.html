<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GameZone - Users</title>

    <style>
		* {
		    box-sizing: border-box;
		}

		body {
		    margin: 0;
		    font-family: Arial, sans-serif;
		    min-height: 100vh;

		    background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);

		    color: white;
		}

		/* NAVBAR */

		.navbar {
		    background: rgba(15, 23, 42, 0.95);

		    color: white;

		    padding: 20px 40px;

		    display: flex;
		    justify-content: space-between;
		    align-items: center;

		    border-bottom: 1px solid rgba(255,255,255,0.1);
		}

		.logo {
		    font-size: 27px;
		    font-weight: bold;
		    color: #c4b5fd;
		}

		.back-btn {
		    background: #4f46e5;

		    color: white;

		    text-decoration: none;

		    padding: 10px 18px;

		    border-radius: 8px;

		    transition: 0.3s;
		}

		.back-btn:hover {
		    background: #7c3aed;
		    transform: translateY(-2px);
		}

		/* CONTAINER */

		.container {
		    width: 90%;
		    max-width: 950px;

		    margin: 45px auto;

		    background: rgba(255,255,255,0.08);

		    padding: 30px;

		    border-radius: 20px;

		    border: 1px solid rgba(255,255,255,0.15);

		    backdrop-filter: blur(12px);

		    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
		}

		h1 {
		    text-align: center;

		    color: #c4b5fd;

		    margin-bottom: 30px;

		    font-size: 32px;
		}

		/* TABLE */

		table {
		    width: 100%;

		    border-collapse: collapse;

		    overflow: hidden;

		    border-radius: 12px;
		}

		th {
		    background: linear-gradient(135deg, #7c3aed, #4f46e5);

		    color: white;

		    padding: 15px;

		    font-size: 16px;
		}

		td {
		    padding: 15px;

		    border-bottom: 1px solid rgba(255,255,255,0.1);

		    text-align: center;

		    color: #e5e7eb;
		}

		tr:hover {
		    background: rgba(124,58,237,0.15);
		}

		.empty {
		    text-align: center;

		    color: #cbd5e1;

		    padding: 25px;
		}

		.bottom {
		    text-align: center;

		    margin-top: 25px;
		}

		/* MOBILE */

		@media(max-width: 700px) {

		    .navbar {
		        padding: 18px;

		        flex-direction: column;

		        gap: 15px;
		    }

		    .container {
		        width: 94%;

		        padding: 20px;

		        overflow-x: auto;
		    }

		    table {
		        min-width: 600px;
		    }

		    h1 {
		        font-size: 27px;
		    }
		}
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        🎮 GameZone Admin
    </div>

    <a href="/admin-dashboard" class="back-btn">
        ⬅ Dashboard
    </a>

</div>

<div class="container">

    <h1>👥 Registered Users</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
        </tr>

        <tr th:each="user : ${users}">

            <td th:text="${user.id}">
                1
            </td>

            <td th:text="${user.username}">
                Sakshi
            </td>

            <td th:text="${user.email}">
                example@gmail.com
            </td>

        </tr>

    </table>

    <div class="empty"
         th:if="${#lists.isEmpty(users)}">

        No registered users found.

    </div>

    <div class="bottom">

        <a href="/admin-dashboard" class="back-btn">
            ⬅ Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
