<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>AI Performance Analyzer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            text-align: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        .performance-box {
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.12);
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .analysis {
            margin-top: 30px;
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 15px;
            text-align: left;
            line-height: 1.8;
            white-space: pre-line;
            border-left: 5px solid #8b5cf6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #6d28d9;
        }

    </style>

</head>

<body>

    <div class="performance-box">

        <h1>📊 AI Performance Analyzer</h1>

        <p>
            Analyze your GameZone performance using AI.
        </p>

        <div class="analysis"
             th:text="${analysis}">
        </div>

        <a href="/home" class="home-btn">
            🏠 Back to Home
        </a>

    </div>

</body>

</html>
