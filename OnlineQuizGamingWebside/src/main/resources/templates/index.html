<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GameZone - Online Gaming Platform</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            margin: 80px auto;
            width: 80%;
            max-width: 700px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #4f46e5;
        }

        h2 {
            color: #374151;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin: 15px 8px;
            padding: 12px 30px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
        }

        .btn:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="navbar">
        🎮 GameZone
    </div>

    <div class="container">

        <h1>🎮 Welcome to GameZone 🎮</h1>

        <h2>Online Gaming Platform</h2>

        <p>
            Play games, earn points and compete with other players!
        </p>

        <a href="/register" class="btn">📝 Register</a>

        <a href="/login" class="btn">🔐 Login</a>

    </div>

</body>
</html>
