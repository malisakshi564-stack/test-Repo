<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GameZone - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #3730a3;
        }

        .message {
            text-align: center;
            color: green;
            margin-bottom: 15px;
        }

        .error {
            text-align: center;
            color: red;
            margin-bottom: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎮 GameZone</div>

    <h2>Login</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <form action="/login" method="post">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Create Account</a>
    </div>

</div>

</body>
</html>
