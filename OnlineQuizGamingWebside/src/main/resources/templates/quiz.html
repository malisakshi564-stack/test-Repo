<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GameZone - Quiz Game</title>

    <style>
		* {
		    box-sizing: border-box;
		    margin: 0;
		    padding: 0;
		}

		body {
		    font-family: Arial, sans-serif;
		    min-height: 100vh;
		    background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
		    color: white;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		}

		.quiz-box {
		    width: 90%;
		    max-width: 650px;
		    padding: 40px;
		    background: rgba(255,255,255,0.08);
		    border: 1px solid rgba(255,255,255,0.15);
		    border-radius: 22px;
		    text-align: center;
		    backdrop-filter: blur(12px);
		    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
		}

		.quiz-box h1 {
		    font-size: 34px;
		    margin-bottom: 25px;
		    color: #c4b5fd;
		}

		#questionNumber {
		    color: #a78bfa;
		    font-weight: bold;
		    margin-bottom: 15px;
		}

		#question {
		    font-size: 23px;
		    margin-bottom: 25px;
		    line-height: 1.4;
		}

		.option {
		    display: block;
		    width: 90%;
		    margin: 12px auto;
		    padding: 15px;

		    background: rgba(255,255,255,0.1);
		    color: white;

		    border: 1px solid rgba(255,255,255,0.2);
		    border-radius: 12px;

		    cursor: pointer;
		    font-size: 16px;

		    transition: 0.25s;
		}

		.option:hover {
		    background: rgba(124,58,237,0.35);
		    border-color: #8b5cf6;
		    transform: translateY(-2px);
		}

		#nextBtn {
		    margin-top: 20px;
		    padding: 13px 30px;

		    border: none;
		    border-radius: 10px;

		    background: linear-gradient(135deg, #7c3aed, #4f46e5);
		    color: white;

		    font-size: 16px;
		    font-weight: bold;

		    cursor: pointer;
		    transition: 0.3s;
		}

		#nextBtn:hover {
		    transform: scale(1.05);
		    box-shadow: 0 8px 20px rgba(124,58,237,0.4);
		}

		#result {
		    margin-top: 25px;
		    font-size: 25px;
		    font-weight: bold;
		    color: #c4b5fd;
		}

		.quiz-box a {
		    display: inline-block;
		    margin-top: 20px;
		    color: #c4b5fd;
		    text-decoration: none;
		}

		.quiz-box a:hover {
		    color: white;
		}
		.home-btn {
		    display: inline-block;
		    margin-top: 25px;
		    padding: 12px 22px;
		    background: #4f46e5;
		    color: white;
		    text-decoration: none;
		    border-radius: 8px;
		    font-weight: bold;
		}

		.home-btn:hover {
		    background: #4338ca;
		}
    </style>
</head>

<body>

    <!-- Logged-in username -->
    <span id="loggedUsername"
          th:text="${username}"
          style="display:none;">
    </span>

    <div class="quiz-box">

        <h1>🧠 Quiz Game</h1>

        <p id="questionNumber"></p>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Next Question
        </button>

        <p id="result"></p>

        <br>
		<a href="/home" class="home-btn">
		    🏠 Back to Home
		</a>
    </div>


    <script>

        const questions = [

            {
                question: "Which language is used for Spring Boot?",
                options: ["Python", "Java", "PHP", "C"],
                answer: "Java"
            },

            {
                question: "Which database are we using in GameZone?",
                options: ["Oracle", "MongoDB", "MySQL", "SQLite"],
                answer: "MySQL"
            },

            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyper Tool Multi Language",
                    "Home Tool Markup Language"
                ],
                answer: "Hyper Text Markup Language"
            },

            {
                question: "Which keyword is used to create a class in Java?",
                options: [
                    "class",
                    "Class",
                    "new",
                    "create"
                ],
                answer: "class"
            },

            {
                question: "Which annotation is used for a Spring Controller?",
                options: [
                    "@Service",
                    "@Entity",
                    "@Controller",
                    "@Repository"
                ],
                answer: "@Controller"
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = "";


        function loadQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("questionNumber").innerText =
                "Question " + (currentQuestion + 1) +
                " of " + questions.length;

            document.getElementById("question").innerText =
                q.question;

            const optionsDiv =
                document.getElementById("options");

            optionsDiv.innerHTML = "";

            selectedAnswer = "";


            q.options.forEach(function(option) {

                const button =
                    document.createElement("button");

                button.innerText = option;

                button.className = "option";


                button.onclick = function() {

                    selectedAnswer = option;

                    document
                        .querySelectorAll(".option")
                        .forEach(function(btn) {
                            btn.style.backgroundColor = "";
                        });

                    button.style.backgroundColor =
                        "lightblue";
                };


                optionsDiv.appendChild(button);

            });

        }


        function nextQuestion() {

            if (selectedAnswer === "") {

                alert("Please select an answer!");

                return;
            }


            if (
                selectedAnswer ===
                questions[currentQuestion].answer
            ) {

                score++;

            }


            currentQuestion++;


            if (
                currentQuestion <
                questions.length
            ) {

                loadQuestion();

            } else {

                showResult();

            }

        }


        function showResult() {

            document.getElementById("questionNumber").innerText = "";

            document.getElementById("question").innerText =
                "🎉 Quiz Completed!";

            document.getElementById("options").innerHTML = "";

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("result").innerText =
                "Your Score: " +
                score +
                " / " +
                questions.length;


            // Get username
            const username =
                document.getElementById("loggedUsername").innerText;


            // Save score
            fetch("/save-score", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    username: username,

                    gameName: "Quiz",

                    score: score

                })

            })

            .then(function(response) {

                console.log(
                    "Response Status:",
                    response.status
                );

                return response.text();

            })

            .then(function(data) {

                console.log(
                    "Server Response:",
                    data
                );

            })

            .catch(function(error) {

                console.error(
                    "Save Error:",
                    error
                );

            });

        }


        // Start Quiz
        loadQuestion();

    </script>

</body>

</html>
