<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>GameZone - Rock Paper Scissors</title>

    <style>

		* {
		    box-sizing: border-box;
		    margin: 0;
		    padding: 0;
		}

		body {
		    font-family: Arial, sans-serif;
		    min-height: 100vh;

		    background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);

		    color: white;

		    display: flex;
		    justify-content: center;
		    align-items: center;
		}

		.game-container {
		    width: 90%;
		    max-width: 600px;

		    padding: 40px 30px;

		    text-align: center;

		    background: rgba(255,255,255,0.08);

		    border: 1px solid rgba(255,255,255,0.15);

		    border-radius: 22px;

		    backdrop-filter: blur(12px);

		    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
		}

		h1 {
		    font-size: 36px;

		    color: #c4b5fd;

		    margin-bottom: 12px;
		}

		.subtitle {
		    color: #cbd5e1;

		    margin-bottom: 30px;
		}

		.choices {
		    display: flex;

		    justify-content: center;

		    gap: 18px;

		    margin: 30px 0;
		}

		.choice {
		    width: 120px;
		    height: 120px;

		    border-radius: 18px;

		    border: 1px solid rgba(255,255,255,0.2);

		    background: rgba(255,255,255,0.1);

		    color: white;

		    font-size: 45px;

		    cursor: pointer;

		    transition: 0.3s;
		}

		.choice:hover {
		    transform: translateY(-8px) scale(1.05);

		    background: rgba(124,58,237,0.35);

		    border-color: #8b5cf6;

		    box-shadow: 0 10px 25px rgba(124,58,237,0.3);
		}

		#result {
		    margin-top: 25px;

		    font-size: 22px;

		    font-weight: bold;

		    color: #ddd6fe;
		}

		#score {
		    margin-top: 15px;

		    font-size: 20px;

		    color: #c4b5fd;
		}

		button {
		    border: none;

		    border-radius: 10px;

		    padding: 12px 25px;

		    background: linear-gradient(135deg, #7c3aed, #4f46e5);

		    color: white;

		    font-size: 16px;

		    font-weight: bold;

		    cursor: pointer;

		    transition: 0.3s;
		}

		button:hover {
		    transform: scale(1.05);

		    box-shadow: 0 8px 20px rgba(124,58,237,0.4);
		}

		a {
		    display: inline-block;

		    margin-top: 25px;

		    color: #c4b5fd;

		    text-decoration: none;
		}

		a:hover {
		    color: white;
		}

		@media(max-width: 500px) {

		    .choices {
		        gap: 8px;
		    }

		    .choice {
		        width: 90px;
		        height: 90px;

		        font-size: 35px;
		    }

		    .game-container {
		        padding: 30px 15px;
		    }
		}

    </style>

</head>

<body>

    <!-- Logged in username -->
    <span id="loggedUsername"
          th:text="${username}"
          style="display:none;">
    </span>

    <div class="navbar">
        
    </div>

    <div class="game-box">

        <h1>✊ Rock Paper Scissors ✌️</h1>

        <p class="round" id="round">
            Round: 0 / 5
        </p>

        <p>Choose your move:</p>

        <div class="choices">

            <button onclick="playGame('Rock')">
                ✊ Rock
            </button>

            <button onclick="playGame('Paper')">
                ✋ Paper
            </button>

            <button onclick="playGame('Scissors')">
                ✌️ Scissors
            </button>

        </div>

        <p id="playerChoice"></p>

        <p id="computerChoice"></p>

        <p id="result"></p>

        <p id="score">
            Your Score: 0
        </p>

        <button id="saveBtn"
                onclick="saveScore()"
                style="display:none;">
            💾 Save Final Score
        </button>

        <button class="restart-btn"
                onclick="restartGame()">
            🔄 Restart
        </button>

        <br>

        <a href="/home" class="back-btn">
            ⬅ Back to Home
        </a>

    </div>


    <script>

        let score = 0;

        let rounds = 0;

        const totalRounds = 5;


        function playGame(playerChoice) {

            if (rounds >= totalRounds) {
                return;
            }

            const choices = [
                "Rock",
                "Paper",
                "Scissors"
            ];

            const randomIndex =
                Math.floor(
                    Math.random() * choices.length
                );

            const computerChoice =
                choices[randomIndex];

            rounds++;


            document.getElementById("playerChoice")
                .innerText =
                "You chose: " + playerChoice;


            document.getElementById("computerChoice")
                .innerText =
                "Computer chose: " + computerChoice;


            let result = "";


            if (playerChoice === computerChoice) {

                result = "🤝 It's a Draw!";

            }

            else if (

                (playerChoice === "Rock" &&
                 computerChoice === "Scissors")

                ||

                (playerChoice === "Paper" &&
                 computerChoice === "Rock")

                ||

                (playerChoice === "Scissors" &&
                 computerChoice === "Paper")

            ) {

                result = "🎉 You Win!";

                score++;

            }

            else {

                result = "😢 Computer Wins!";

            }


            document.getElementById("result")
                .innerText = result;


            document.getElementById("score")
                .innerText =
                "Your Score: " + score;


            document.getElementById("round")
                .innerText =
                "Round: " + rounds +
                " / " + totalRounds;


            if (rounds === totalRounds) {

                finishGame();

            }

        }


        function finishGame() {

            document.getElementById("result")
                .innerText =
                "🎉 Game Completed! Final Score: " +
                score + " / " + totalRounds;


            document.getElementById("saveBtn")
                .style.display = "inline-block";

        }


        function saveScore() {

            const username =
                document.getElementById(
                    "loggedUsername"
                ).innerText;


            fetch("/save-score", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    username: username,

                    gameName:
                        "Rock Paper Scissors",

                    score: score

                })

            })

            .then(function(response) {

                return response.text();

            })

            .then(function(data) {

                alert(
                    "🏆 Score Saved Successfully!"
                );

                document.getElementById("saveBtn")
                    .style.display = "none";

            })

            .catch(function(error) {

                alert(
                    "❌ Error saving score!"
                );

                console.error(error);

            });

        }


        function restartGame() {

            score = 0;

            rounds = 0;


            document.getElementById("playerChoice")
                .innerText = "";

            document.getElementById("computerChoice")
                .innerText = "";

            document.getElementById("result")
                .innerText = "";

            document.getElementById("score")
                .innerText =
                "Your Score: 0";

            document.getElementById("round")
                .innerText =
                "Round: 0 / " + totalRounds;

            document.getElementById("saveBtn")
                .style.display = "none";

        }

    </script>

</body>

</html>
