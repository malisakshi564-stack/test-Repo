<!DOCTYPE html>
<html>
<head>
    <title>AI Quiz Generator</title>

	<style>

	    body {
	        font-family: Arial, sans-serif;
	        background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
	        color: white;
	        text-align: center;
	        padding: 50px 20px;
	        min-height: 100vh;
	        box-sizing: border-box;
	    }

	    .quiz-box {
	        max-width: 900px;
	        margin: auto;
	        background: rgba(255,255,255,0.12);
	        padding: 40px;
	        border-radius: 20px;
	        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
	    }

	    h1 {
	        font-size: 38px;
	        margin-bottom: 15px;
	    }

	    .quiz-box > p {
	        font-size: 18px;
	        margin-bottom: 25px;
	    }

	    input {
	        width: 80%;
	        max-width: 600px;
	        padding: 14px;
	        margin: 20px 0;
	        border-radius: 8px;
	        border: none;
	        font-size: 16px;
	        box-sizing: border-box;
	    }

	    button {
	        padding: 13px 25px;
	        border: none;
	        border-radius: 8px;
	        background: #7c3aed;
	        color: white;
	        font-size: 16px;
	        font-weight: bold;
	        cursor: pointer;
	        transition: 0.3s;
	    }

	    button:hover {
	        background: #6d28d9;
	        transform: translateY(-2px);
	    }

	    #result {
	        margin-top: 30px;
	        text-align: left;
	    }

	    #result p {
	        background: rgba(255,255,255,0.08);
	        padding: 25px;
	        border-radius: 15px;
	        line-height: 1.8;
	        font-size: 17px;
	        white-space: pre-line;
	        border-left: 5px solid #8b5cf6;
	    }
		.home-btn {
		    display: inline-block;
		    margin-top: 25px;
		    padding: 12px 22px;
		    background: #4f46e5;
		    color: white;
		    text-decoration: none;
		    border-radius: 8px;
		    font-weight: bold;
		}

		.home-btn:hover {
		    background: #4338ca;
		}

	</style>
</head>

<body>

    <div class="quiz-box">

        <h1>🤖 AI Quiz Generator</h1>

        <p>Enter a topic and generate quiz questions using AI.</p>

		<form action="/generate-ai-quiz" method="post">

		    <input type="text"
		           name="topic"
		           placeholder="Example: Java, Python, DBMS"
		           required>

		    <br>

		    <button type="submit">
		        🤖 Generate AI Quiz
		    </button>

		</form>

		<div id="result" style="margin-top:25px;">
		    <p th:if="${result}" th:text="${result}"></p>
		</div>
    </div>

	<a href="/home" class="home-btn">
	    🏠 Back to Home
	</a>
</body>
</html>
