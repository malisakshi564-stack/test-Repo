<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GameZone - Manage Games</title>

    <style>
		* {
		    box-sizing: border-box;
		}

		body {
		    margin: 0;
		    font-family: Arial, sans-serif;
		    min-height: 100vh;

		    background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);

		    color: white;
		}

		/* NAVBAR */

		.navbar {
		    background: rgba(15, 23, 42, 0.95);

		    color: white;

		    padding: 20px 40px;

		    display: flex;
		    justify-content: space-between;
		    align-items: center;

		    border-bottom: 1px solid rgba(255,255,255,0.1);
		}

		.logo {
		    font-size: 27px;
		    font-weight: bold;
		    color: #c4b5fd;
		}

		.back {
		    background: #4f46e5;

		    color: white;

		    text-decoration: none;

		    padding: 10px 18px;

		    border-radius: 8px;

		    transition: 0.3s;
		}

		.back:hover {
		    background: #7c3aed;
		    transform: translateY(-2px);
		}

		/* CONTAINER */

		.container {
		    max-width: 1100px;

		    margin: 40px auto;

		    padding: 20px;
		}

		/* BOX */

		.box {
		    background: rgba(255,255,255,0.08);

		    padding: 30px;

		    border-radius: 20px;

		    border: 1px solid rgba(255,255,255,0.15);

		    backdrop-filter: blur(12px);

		    box-shadow: 0 20px 45px rgba(0,0,0,0.35);

		    margin-bottom: 30px;
		}

		h1 {
		    text-align: center;

		    color: #c4b5fd;

		    font-size: 32px;

		    margin-bottom: 30px;
		}

		h2 {
		    margin-bottom: 20px;

		    color: #ddd6fe;
		}

		/* FORM */

		input,
		textarea {
		    width: 100%;

		    padding: 13px;

		    margin-bottom: 15px;

		    border: 1px solid rgba(255,255,255,0.2);

		    border-radius: 10px;

		    font-size: 16px;

		    background: rgba(255,255,255,0.08);

		    color: white;

		    outline: none;
		}

		input::placeholder,
		textarea::placeholder {
		    color: #cbd5e1;
		}

		input:focus,
		textarea:focus {
		    border-color: #8b5cf6;

		    box-shadow: 0 0 10px rgba(139,92,246,0.25);
		}

		textarea {
		    height: 100px;

		    resize: none;
		}

		button {
		    background: linear-gradient(135deg, #7c3aed, #4f46e5);

		    color: white;

		    border: none;

		    padding: 12px 25px;

		    border-radius: 10px;

		    font-size: 16px;

		    font-weight: bold;

		    cursor: pointer;

		    transition: 0.3s;
		}

		button:hover {
		    transform: translateY(-2px);

		    box-shadow: 0 8px 20px rgba(124,58,237,0.4);
		}

		/* TABLE */

		table {
		    width: 100%;

		    border-collapse: collapse;

		    table-layout: fixed;

		    overflow: hidden;

		    border-radius: 12px;
		}

		th {
		    background: linear-gradient(135deg, #7c3aed, #4f46e5);

		    color: white;

		    padding: 15px;
		}

		td {
		    padding: 15px;

		    border-bottom: 1px solid rgba(255,255,255,0.1);

		    vertical-align: middle;

		    color: #e5e7eb;
		}

		tr:hover {
		    background: rgba(124,58,237,0.15);
		}

		/* COLUMN WIDTHS */

		th:nth-child(1),
		td:nth-child(1) {
		    width: 10%;
		    text-align: center;
		}

		th:nth-child(2),
		td:nth-child(2) {
		    width: 20%;
		}
		th:nth-child(3),
		td:nth-child(3) {
		    width: 30%;
		}

		th:nth-child(4),
		td:nth-child(4) {
		    width: 20%;
		    text-align: center;
		}

		th:nth-child(5),
		td:nth-child(5) {
		    width: 20%;
		    text-align: center;
		}

		/* ACTION BUTTONS */

		.action-buttons {
		    display: flex;

		    justify-content: center;

		    align-items: center;

		    gap: 8px;
		}

		.edit-btn {
		    background: #f59e0b;

		    color: white;

		    padding: 8px 14px;

		    border-radius: 7px;

		    text-decoration: none;

		    white-space: nowrap;

		    transition: 0.3s;
		}

		.edit-btn:hover {
		    background: #d97706;

		    transform: translateY(-2px);
		}

		.delete-btn {
		    background: #ef4444;

		    color: white;

		    padding: 8px 14px;

		    border-radius: 7px;

		    text-decoration: none;

		    white-space: nowrap;

		    transition: 0.3s;
		}

		.delete-btn:hover {
		    background: #dc2626;

		    transform: translateY(-2px);
		}

		.empty {
		    text-align: center;

		    color: #cbd5e1;

		    padding: 25px;
		}

		/* MOBILE */

		@media(max-width: 750px) {

		    .navbar {
		        padding: 18px;

		        flex-direction: column;

		        gap: 15px;
		    }

		    .container {
		        width: 95%;

		        padding: 10px;

		        overflow-x: auto;
		    }

		    .box {
		        padding: 20px;
		    }

		    table {
		        min-width: 750px;
		    }

		    h1 {
		        font-size: 27px;
		    }
			.bottom-dashboard {
			    text-align: center;
			    margin-top: 30px;
			}

			.bottom-dashboard a {
			    display: inline-block;
			    padding: 12px 25px;
			    background: #4f46e5;
			    color: white;
			    text-decoration: none;
			    border-radius: 8px;
			    font-weight: bold;
			}

			.bottom-dashboard a:hover {
			    background: #7c3aed;
			}
		}
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        🎮 GameZone Admin
    </div>

    <a href="/admin-dashboard" class="back">
        ⬅ Dashboard
    </a>

</div>


<div class="container">

    <h1>🎮 Manage Games</h1>


    <!-- Add Game -->

    <div class="box">

        <h2>➕ Add New Game</h2>

        <form action="/admin-games/add" method="post">

            <input
                type="text"
                name="name"
                placeholder="Enter Game Name"
                required>
				<input type="text" name="playUrl" placeholder="Enter Play URL" required>
				
            <textarea
                name="description"
                placeholder="Enter Game Description"
                required></textarea>

            <button type="submit">
                Add Game
            </button>

        </form>

    </div>


    <!-- Games List -->

    <div class="box">

        <h2>📋 Available Games</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Game Name</th>
                <th>Description</th>
				<th>Play URL</th>
                <th>Action</th>
				
            </tr>


            <tr th:each="game : ${games}">

                <td th:text="${game.id}">
                    1
                </td>

                <td th:text="${game.name}">
                    Game Name
                </td>

                <td th:text="${game.description}">
                    Description
                </td>
				<td th:text="${game.playUrl}">/quiz</td>

				<td>
				    <div class="action-buttons">

				        <a th:href="@{/admin-games/edit/{id}(id=${game.id})}"
				           class="edit-btn">
				            ✏️ Edit
				        </a>

				        <a th:href="@{/admin-games/delete/{id}(id=${game.id})}"
				           class="delete-btn">
				            🗑️ Delete
				        </a>

				    </div>
				</td>
            </tr>


            <tr th:if="${#lists.isEmpty(games)}">

                <td colspan="5" class="empty">
                    No games available.
                </td>

            </tr>

        </table>
		<div style="text-align:center; margin-top:30px; margin-bottom:20px;">
		    <a href="/admin-dashboard"
		       style="display:inline-block;
		              padding:12px 25px;
		              background:#4f46e5;
		              color:white;
		              text-decoration:none;
		              border-radius:8px;
		              font-weight:bold;">
		        ⬅ Back to Admin Dashboard
		    </a>
		</div>
    </div>

</div>

</body>
</html>
